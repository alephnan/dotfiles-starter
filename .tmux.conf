# ── General ───────────────────────────────────────────────────────────
set -g mouse on
setw -g mode-keys vi
set -g focus-events on
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# True color: tmux-256color as the inner TERM, RGB capability passed through
set -g default-terminal "tmux-256color"
set -ga terminal-features "*:RGB"

# ── Plugins ───────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'

# ── Catppuccin ────────────────────────────────────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Initialize TMUX plugin manager (keep this line near the bottom)
run '~/.tmux/plugins/tpm/tpm'

# ── Status bar ────────────────────────────────────────────────────────
# Must come AFTER tpm: the @catppuccin_status_* variables are defined by
# the plugin at load time, then expanded lazily via #{E:...}.
set -g status-position top
set -g status-left-length 100
set -g status-right-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_directory}"
set -ga status-right "#{E:@catppuccin_status_session}"
set -ga status-right "#{E:@catppuccin_status_date_time}"
