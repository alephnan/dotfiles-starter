"$schema" = 'https://starship.rs/config-schema.json'

# Minimal prompt: only what changes per command.
# User / OS / clock intentionally omitted -- the tmux status bar
# already carries that context, and it is drawn once instead of
# being reprinted on every prompt.
format = "$directory$git_branch$git_status$character"
add_newline = false
palette = 'catppuccin_mocha'

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "bold mauve"
truncation_length = 15
truncation_symbol = "…"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold peach"
format = "[$all_status$ahead_behind]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
